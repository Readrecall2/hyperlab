version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: jjlab-hyperlab_dashboard_1
      APP_PORT: 8000

  dashboard:
    image: ghcr.io/REPLACE_WITH_GITHUB_USER/REPLACE_WITH_REPOSITORY:REPLACE_WITH_TAG
    user: "1000:1000"
    init: true
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HYPERLAB_MODE: readonly
      HYPERLAB_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  collector:
    image: ghcr.io/REPLACE_WITH_GITHUB_USER/REPLACE_WITH_REPOSITORY:REPLACE_WITH_TAG
    user: "1000:1000"
    init: true
    command: ["collect", "--interval-seconds", "60", "--samples", "0", "--network", "mainnet"]
    environment:
      HYPERLAB_MODE: readonly
      HYPERLAB_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
