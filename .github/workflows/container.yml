name: Publish signed container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable tag to publish (for example v0.2.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  preflight:
    name: Full release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_name: ${{ steps.release.outputs.image_name }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          tag="${DISPATCH_TAG:-$REF_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact vMAJOR.MINOR.PATCH tag" >&2
            exit 2
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SOURCE_REF" != "refs/tags/$tag" ]]; then
            echo "Manual releases must run the workflow from the exact requested tag" >&2
            exit 2
          fi
          if [[ "$REF_TYPE" != "tag" || "$REF_PROTECTED" != "true" ]]; then
            echo "Release must originate from a tag covered by an active GitHub ruleset" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_name=${REPOSITORY_OWNER,,}/hyperlab" >> "$GITHUB_OUTPUT"
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the verified release commit
        id: source
        shell: bash
        env:
          SOURCE_EVENT_SHA: ${{ github.sha }}
        run: |
          event_commit=$(git rev-parse "${SOURCE_EVENT_SHA}^{commit}")
          checked_out_commit=$(git rev-parse HEAD)
          if [[ "$checked_out_commit" != "$event_commit" ]]; then
            echo "Checkout does not match the immutable event SHA" >&2
            exit 2
          fi
          echo "sha=$event_commit" >> "$GITHUB_OUTPUT"
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Verify the GitHub tag still targets the immutable event commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/verify_github_tag.py
          --repository "${{ github.repository }}"
          --tag "${{ steps.release.outputs.tag }}"
          --expected-commit "${{ steps.source.outputs.sha }}"
      - name: Install the hash-locked CI environment
        run: python -m pip install --require-hashes --requirement requirements-ci.lock
      - name: Verify immutable release inputs
        run: >-
          python scripts/verify_release.py --template --check-manifest
          --tag "${{ steps.release.outputs.tag }}"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/hyperlab
      - name: Full pytest suite
        run: pytest --cov=hyperlab --cov-report=term-missing

  secret-scan:
    name: Release history secret scan
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan all tracked history with secret redaction
        run: gitleaks git --redact --exit-code 1 --log-opts="--all" .

  image-scan:
    name: Pre-publish vulnerability gate (${{ matrix.arch }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Install checksum-pinned Buildx 0.34.1
        shell: bash
        env:
          BUILDX_SHA256: f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
        run: |
          binary="$RUNNER_TEMP/buildx-v0.34.1.linux-amd64"
          plugin_dir="$HOME/.docker/cli-plugins"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$binary" \
            https://github.com/docker/buildx/releases/download/v0.34.1/buildx-v0.34.1.linux-amd64
          echo "$BUILDX_SHA256  $binary" | sha256sum --check --strict
          mkdir --parents "$plugin_dir"
          install --mode 0755 "$binary" "$plugin_dir/docker-buildx"
          docker buildx version | grep --fixed-strings 'v0.34.1'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug=false
      - name: Build one architecture locally without registry credentials
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          platforms: ${{ matrix.platform }}
          tags: hyperlab-prepublish:${{ matrix.arch }}-${{ github.run_id }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Install checksum-pinned Trivy 0.72.0
        shell: bash
        env:
          TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
        run: |
          archive="$RUNNER_TEMP/trivy_0.72.0_Linux-64bit.tar.gz"
          install_dir="$RUNNER_TEMP/trivy-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "$TRIVY_SHA256  $archive" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" trivy
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Block HIGH and CRITICAL vulnerabilities before any push
        shell: bash
        env:
          IMAGE_REF: hyperlab-prepublish:${{ matrix.arch }}-${{ github.run_id }}
          REPORT: trivy-${{ matrix.arch }}.sarif
        run: |
          trivy image --format sarif --output "$REPORT" --exit-code 0 \
            --ignore-unfixed=false --severity HIGH,CRITICAL --pkg-types os,library \
            "$IMAGE_REF"
          trivy image --format table --output /dev/null --exit-code 1 \
            --ignore-unfixed=false --severity HIGH,CRITICAL --pkg-types os,library \
            "$IMAGE_REF"
      - name: Upload architecture scan to code scanning
        if: always() && hashFiles('trivy-*.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-${{ matrix.arch }}.sarif
          category: hyperlab-prepublish-${{ matrix.arch }}
      - name: Preserve architecture scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-${{ matrix.arch }}-${{ needs.preflight.outputs.release_tag }}
          path: trivy-${{ matrix.arch }}.sarif
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Multi-architecture build, vulnerability gate and signature
    needs: [preflight, secret-scan, image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: signed-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    env:
      IMAGE_NAME: ${{ needs.preflight.outputs.image_name }}
    steps:
      - name: Check out the verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Install checksum-pinned Buildx 0.34.1
        shell: bash
        env:
          BUILDX_SHA256: f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
        run: |
          binary="$RUNNER_TEMP/buildx-v0.34.1.linux-amd64"
          plugin_dir="$HOME/.docker/cli-plugins"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$binary" \
            https://github.com/docker/buildx/releases/download/v0.34.1/buildx-v0.34.1.linux-amd64
          echo "$BUILDX_SHA256  $binary" | sha256sum --check --strict
          mkdir --parents "$plugin_dir"
          install --mode 0755 "$binary" "$plugin_dir/docker-buildx"
          docker buildx version | grep --fixed-strings 'v0.34.1'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug=false
      - name: Log in to GHCR with the job-scoped token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing semantic-version image tag
        id: release-image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          final_ref="$REGISTRY/$IMAGE_NAME:$version"
          set +e
          inspect_output=$(docker buildx imagetools inspect "$final_ref" --raw 2>&1)
          inspect_status=$?
          set -e
          if [[ "$inspect_status" -eq 0 ]]; then
            echo "Refusing to move existing immutable image tag: $final_ref" >&2
            exit 2
          fi
          if ! grep --ignore-case --extended-regexp \
            'manifest unknown|name unknown|not found' <<<"$inspect_output" >/dev/null; then
            echo "Registry tag existence check failed closed" >&2
            echo "$inspect_output" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "final_ref=$final_ref" >> "$GITHUB_OUTPUT"
      - name: Build and push the vulnerability-gated multi-architecture candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64
      - name: Verify the published multi-architecture manifest platforms
        id: manifest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest-index.json
          python scripts/verify_oci_index.py manifest-index.json >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned Trivy 0.72.0
        shell: bash
        env:
          TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
        run: |
          archive="$RUNNER_TEMP/trivy_0.72.0_Linux-64bit.tar.gz"
          install_dir="$RUNNER_TEMP/trivy-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "$TRIVY_SHA256  $archive" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" trivy
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Block vulnerabilities on the exact published amd64 child digest
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.amd64_digest }}
        run: |
          trivy image --format sarif --output trivy-published-amd64.sarif --exit-code 0 \
            --ignore-unfixed=false --severity HIGH,CRITICAL --pkg-types os,library \
            "$IMAGE_REF"
          trivy image --format table --output /dev/null --exit-code 1 \
            --ignore-unfixed=false --severity HIGH,CRITICAL --pkg-types os,library \
            "$IMAGE_REF"
      - name: Block vulnerabilities on the exact published arm64 child digest
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.arm64_digest }}
        run: |
          trivy image --format sarif --output trivy-published-arm64.sarif --exit-code 0 \
            --ignore-unfixed=false --severity HIGH,CRITICAL --pkg-types os,library \
            "$IMAGE_REF"
          trivy image --format table --output /dev/null --exit-code 1 \
            --ignore-unfixed=false --severity HIGH,CRITICAL --pkg-types os,library \
            "$IMAGE_REF"
      - name: Upload published-child scans to code scanning
        if: always() && hashFiles('trivy-published-*.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: .
          category: hyperlab-published-candidate-children
      - name: Preserve published-child scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-published-children-${{ needs.preflight.outputs.release_tag }}
          path: trivy-published-*.sarif
          if-no-files-found: error
          retention-days: 90
      - name: Install checksum-pinned Syft 1.51.0 without mutable installer scripts
        shell: bash
        env:
          SYFT_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
        run: |
          archive="$RUNNER_TEMP/syft_1.51.0_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/syft-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_linux_amd64.tar.gz
          echo "$SYFT_SHA256  $archive" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" syft
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Generate reviewable SPDX JSON SBOMs for both exact child digests
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.manifest.outputs.arm64_digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          syft scan "$IMAGE@$AMD64_DIGEST" --output spdx-json=sbom-amd64.spdx.json
          syft scan "$IMAGE@$ARM64_DIGEST" --output spdx-json=sbom-arm64.spdx.json
      - name: Create a digest-bound release receipt
        shell: bash
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.manifest.outputs.arm64_digest }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          sha256sum sbom-amd64.spdx.json sbom-arm64.spdx.json > sbom-sha256.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom_hashes = {}
          for line in Path("sbom-sha256.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              sbom_hashes[filename.removeprefix("*")] = f"sha256:{digest}"
          receipt = {
              "schema": "hyperlab-phase15-release-receipt-v1",
              "image": f"ghcr.io/{os.environ['IMAGE_NAME']}",
              "version": os.environ["RELEASE_TAG"].removeprefix("v"),
              "release_tag": os.environ["RELEASE_TAG"],
              "source_commit": os.environ["RELEASE_SHA"],
              "workflow": ".github/workflows/container.yml",
              "index_digest": os.environ["INDEX_DIGEST"],
              "platform_digests": {
                  "linux/amd64": os.environ["AMD64_DIGEST"],
                  "linux/arm64": os.environ["ARM64_DIGEST"],
              },
              "sbom_sha256": sbom_hashes,
              "vulnerability_gate": {
                  "scanner": "trivy",
                  "scanner_version": "0.72.0",
                  "scanner_archive_sha256": "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea",
                  "severity": ["HIGH", "CRITICAL"],
                  "ignore_unfixed": False,
                  "result": "pass",
              },
          }
          Path("release-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-${{ needs.preflight.outputs.release_tag }}
          path: |
            sbom-amd64.spdx.json
            sbom-arm64.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Attach GitHub build provenance to the digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attach the amd64 SPDX SBOM attestation to its child digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.amd64_digest }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
      - name: Attach the arm64 SPDX SBOM attestation to its child digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.arm64_digest }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the vulnerability-gated digest with GitHub OIDC
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the just-created keyless signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@refs/tags/${{ needs.preflight.outputs.release_tag }}
        run: >-
          cosign verify "$IMAGE@$DIGEST"
          --certificate-identity "$CERTIFICATE_IDENTITY"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign and verify the digest-bound release receipt
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@refs/tags/${{ needs.preflight.outputs.release_tag }}
        run: |
          cosign sign-blob --yes --bundle release-receipt.sigstore.json release-receipt.json
          cosign verify-blob \
            --bundle release-receipt.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-receipt.json
      - name: Preserve the signed receipt bundle before semantic-version promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-receipt-${{ needs.preflight.outputs.release_tag }}
          path: |
            release-receipt.json
            release-receipt.sigstore.json
          if-no-files-found: error
          retention-days: 90
      - name: Revalidate the source tag before semantic-version promotion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/verify_github_tag.py
          --repository "${{ github.repository }}"
          --tag "${{ needs.preflight.outputs.release_tag }}"
          --expected-commit "${{ needs.preflight.outputs.release_sha }}"
      - name: Promote the verified digest to the immutable semantic-version tag
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          FINAL_REF: ${{ steps.release-image.outputs.final_ref }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools create --tag "$FINAL_REF" "$IMAGE@$DIGEST"
          observed=$(docker buildx imagetools inspect "$FINAL_REF" --raw | sha256sum | awk '{print "sha256:" $1}')
          if [[ "$observed" != "$DIGEST" ]]; then
            echo "Promoted manifest digest mismatch: expected $DIGEST, observed $observed" >&2
            exit 2
          fi
